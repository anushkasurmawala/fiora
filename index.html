 {note:'Petal pink glass with a frosted peony.', cap:[.80,.43,.49], shoulder:[1,.70,.71], glassBase:[.71,.30,.40]},
 {note:'Muted mauve glass with gold wildflower stems.', cap:[.69,.39,.45], shoulder:[.99,.72,.69], glassBase:[.59,.29,.38]}
];
const canvas=document.querySelector('#viewport');
const gl=canvas.getContext('webgl',{alpha:true,antialias:true});
if(!gl){
 canvas.hidden=true;
 document.querySelector('.controls').hidden=true;
 document.querySelector('#fallback').style.display='block';
}else init();

function init(){
 const vertex=`
 attribute vec3 position; attribute vec2 uv; attribute vec3 normal;
 varying vec2 tex; varying vec3 n; varying vec3 p;
 uniform vec3 view; uniform vec2 resolution;
 vec3 rotate(vec3 q){
   float c=cos(view.x), s=sin(view.x), a=cos(view.y), b=sin(view.y);
   vec3 yaw=vec3(c*q.x+s*q.z,q.y,-s*q.x+c*q.z);
   return vec3(yaw.x,a*yaw.y-b*yaw.z,b*yaw.y+a*yaw.z);
 }
 void main(){
   vec3 q=rotate(position); n=rotate(normal); p=position; tex=uv;
   float w=1.0-q.z/8.0;
   gl_Position=vec4(q.x*view.z*resolution.y/resolution.x,q.y*view.z,-q.z/8.0,w);
 }`;
 const fragment=`
 precision mediump float;
 varying vec2 tex; varying vec3 n; varying vec3 p;
 uniform sampler2D photo; uniform vec3 lightTint, glassShoulder, glassBase; uniform int mode; uniform bool goldTitle;
 void main(){
   vec3 norm=normalize(n);
   if(mode==0){
     vec3 ink=texture2D(photo,tex).rgb;
     if(goldTitle && tex.x>.255 && tex.x<.755 && tex.y>.535 && tex.y<.618){
       float mask=smoothstep(.15,.27,ink.r-ink.g)*(1.0-smoothstep(.44,.73,ink.g));
       float shade=smoothstep(.05,.67,ink.g);
       vec3 gold=mix(vec3(.59,.33,.09),vec3(.98,.75,.34),shade);
       gold=mix(gold,vec3(1.0,.89,.64),.29*exp(-pow((tex.y-.592)/.013,2.0)));
       ink=mix(ink,gold,mask);
     }
     gl_FragColor=vec4(ink,1.0);
     return;
   }
   float lighting=0.79+0.22*max(0.0,dot(norm,normalize(vec3(-0.45,0.7,1.0))));
   vec3 color;
   if(mode==1){
     float depth=.51*min(1.0,.83+(p.y+1.71)*.13);
     float across=p.z/depth;
     float edge=abs(across);
     float curvature=clamp(1.0-abs(norm.z),0.0,1.0);
     float shoulder=smoothstep(.55,1.06,p.y);
     float heel=1.0-smoothstep(-1.64,-1.42,p.y);
     float sideHeight=smoothstep(-1.66,-1.46,p.y)*(1.0-smoothstep(.64,1.08,p.y));
     float yCurve=.04*cos((p.y+.25)*2.0);
     float roll=.07*norm.x;
     float key=exp(-pow((across-.68-roll-yCurve)/.085,2.0));
     float fill=exp(-pow((across+.79-roll+yCurve)/.070,2.0));
     float softbox=exp(-pow((across-.49-roll)/.235,2.0));
     float innerWall=exp(-pow((edge-.88)/.105,2.0))*sideHeight;
     float outerEdge=smoothstep(.91,1.0,edge);
     float liquidLine=exp(-pow((p.y+1.42+.05*across*across)/.045,2.0));
     float baseGlint=exp(-pow((p.y+1.60+.03*across*across)/.039,2.0));
     float shoulderGlint=exp(-pow((p.y-.91+.13*across*across)/.070,2.0));
     float gradient=smoothstep(-1.41,.93,p.y);
     vec3 glassColor=mix(glassBase,glassShoulder,gradient);
     glassColor=mix(glassColor,vec3(.97,.91,.88),heel*.86);
     glassColor*=1.0-innerWall*.36-outerEdge*.11-liquidLine*.24;
     float highlights=(key*.87+fill*.67+softbox*.22)*sideHeight
       +baseGlint*.86+shoulderGlint*.45+outerEdge*curvature*.23;
     glassColor=mix(glassColor,vec3(1.0,.98,.93),min(.94,highlights));
     float opacity=clamp(.61+innerWall*.24+highlights*.31+shoulder*.14-heel*.10,.48,.97);
     gl_FragColor=vec4(glassColor,opacity);
     return;
   }else if(mode==2){
     color=lightTint*lighting+0.12*pow(max(0.0,dot(norm,normalize(vec3(-.32,.32,1.0)))),10.0);
   }else{
     color=vec3(.64,.37,.16)+vec3(.34,.43,.41)*pow(max(0.0,dot(norm,normalize(vec3(-.4,.2,1.0)))),6.0);
   }
   gl_FragColor=vec4(color,1.0);
 }`;
 function shader(type,source){
   const item=gl.createShader(type);
   gl.shaderSource(item,source);gl.compileShader(item);
   if(!gl.getShaderParameter(item,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(item));
   return item;
 }
 const program=gl.createProgram();
 gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));
 gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));
 gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
 gl.useProgram(program);
 const uniforms=Object.fromEntries(['view','resolution','photo','lightTint','glassShoulder','glassBase','mode','goldTitle'].map(name=>[name,gl.getUniformLocation(program,name)]));
 const attributes=['position','uv','normal'].map(name=>gl.getAttribLocation(program,name));
 const outline=[
 [0,1.07],[.36,1.06],[.65,1.02],[.85,.94],[1,.81],[1.11,.61],[1.15,.35],
 [1.14,-.05],[1.1,-.62],[1.065,-1.05],[1.025,-1.35],[.96,-1.53],[.86,-1.65],[.72,-1.7],[0,-1.71]
 ];
 outline.push(...outline.slice(1,-1).reverse().map(([x,y])=>[-x,y]));
 const vertices=[];
 const meshes=[];
 function point(p,uv,n){vertices.push(...p,...uv,...n);}
 function mesh(mode,build){
   const start=vertices.length/8; build();
   meshes.push({start,count:vertices.length/8-start,mode});
 }
 function profile(k,depth){
   return outline.map(([x,y])=>[x*k,(y+.32)*k-.32,depth*Math.min(1,.83+(y+1.71)*.13)]);
 }
 function face(depth,scale){
   mesh(0,()=>{
     const ring=profile(scale,depth), sign=Math.sign(depth);
     const emit=p=>point(p,[.5+sign*p[0]/2.32,(p[1]+1.71)/2.79],[0,0,sign]);
     for(let i=0;i<ring.length;i++){
       emit([0,-.32,depth]);emit(ring[i]);emit(ring[(i+1)%ring.length]);
     }
   });
 }
 face(.51,.93);
 face(-.51,.93);
 mesh(1,()=>{
   const rows=[[.93,.51],[.98,.466],[1,.363],[1,-.363],[.98,-.466],[.93,-.51]];
   for(let j=0;j<rows.length-1;j++){
     const a=profile(...rows[j]),b=profile(...rows[j+1]);
     for(let i=0;i<a.length;i++){
       const next=(i+1)%a.length;
       const emit=(row,k,step)=>point(row[k],[0,0],[outline[k][0],(outline[k][1]+.32)*.58,step]);
       const az=j<2?.62-j*.3:j>2?-(j-2)*.31:0, bz=j<2?az-.3:j>=2?az-.27:0;
       emit(a,i,az);emit(a,next,az);emit(b,next,bz);
       emit(a,i,az);emit(b,next,bz);emit(b,i,bz);
     }
   }
 });
 function cap(mode,radii,rows,exponent=2){
   mesh(mode,()=>{
     const steps=72;
     function emit(i,j){
       const t=i/steps*2*Math.PI,[height,scale,tilt]=rows[j];
       const x=Math.cos(t), z=Math.sin(t);
       const profile=value=>Math.sign(value)*Math.pow(Math.abs(value),2/exponent);
       const facing=value=>Math.sign(value)*Math.pow(Math.abs(profile(value)),exponent-1);
       point(
         [profile(x)*radii[0]*scale,height,profile(z)*radii[1]*scale],
         [0,0],
         [facing(x)*(1-Math.abs(tilt)),tilt,facing(z)*(1-Math.abs(tilt))]
       );
     }
     for(let j=0;j<rows.length-1;j++){
       for(let i=0;i<steps;i++){
         emit(i,j);emit(i+1,j);emit(i+1,j+1);
         emit(i,j);emit(i+1,j+1);emit(i,j+1);
       }
     }
   });
 }
 cap(3,[.42,.34],[[1.04,0,-1],[1.04,.95,-.45],[1.06,1,0],[1.14,1,0],[1.15,.95,.45],[1.15,0,1]]);
 cap(2,[.60,.40],[[1.14,0,-1],[1.14,.96,-.55],[1.16,1,0],[1.91,1,0],[1.935,.98,.42],[1.95,.94,1],[1.95,0,1]],3.3);
 const buffer=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);
 [[3,0],[2,12],[3,20]].forEach(([size,offset],i)=>{
   gl.enableVertexAttribArray(attributes[i]);gl.vertexAttribPointer(attributes[i],size,gl.FLOAT,false,32,offset);
 });
 gl.enable(gl.DEPTH_TEST);
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 let selected=1,yaw=-.14,pitch=.07,zoom=1;
 const maps=textures.map(pair=>pair.map(source=>{
   const texture=gl.createTexture();
   gl.bindTexture(gl.TEXTURE_2D,texture);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([233,171,165]));
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
   gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
   const image=new Image();
   image.onload=()=>{
     gl.bindTexture(gl.TEXTURE_2D,texture);
     gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,image);
     draw();
   };
   image.src=source;
   return texture;
 }));
 function resize(){
   const rect=canvas.getBoundingClientRect();
   const ratio=Math.min(devicePixelRatio,2);
   canvas.width=Math.max(1,Math.round(rect.width*ratio));
   canvas.height=Math.max(1,Math.round(rect.height*ratio));
   draw();
 }
 function draw(){
   gl.viewport(0,0,canvas.width,canvas.height);
   gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   const fit=Math.min(.43,.76*canvas.width/canvas.height);
   gl.uniform2f(uniforms.resolution,canvas.width,canvas.height);
   gl.uniform3f(uniforms.view,yaw,pitch,fit*zoom);
   const finish=finishes[selected];
   meshes.forEach(({start,count,mode},index)=>{
     if(mode===1)return;
     gl.uniform1i(uniforms.mode,mode);
     if(mode===0){
       gl.uniform1i(uniforms.goldTitle,Number(selected===1&&index===0));
       gl.bindTexture(gl.TEXTURE_2D,maps[selected][index]);
       gl.frontFace(index===0?gl.CW:gl.CCW);
       gl.enable(gl.CULL_FACE);
     }
     gl.uniform3fv(uniforms.lightTint,finish.cap);
     gl.drawArrays(gl.TRIANGLES,start,count);
     if(mode===0)gl.disable(gl.CULL_FACE);
   });

   // Blend the nearest translucent glass surface over the studio backdrop.
   const side=meshes.find(mesh=>mesh.mode===1);
   gl.uniform1i(uniforms.mode,side.mode);
   gl.uniform3fv(uniforms.glassShoulder,finish.shoulder);
   gl.uniform3fv(uniforms.glassBase,finish.glassBase);
   gl.colorMask(false,false,false,false);
   gl.drawArrays(gl.TRIANGLES,side.start,side.count);
   gl.colorMask(true,true,true,true);
   gl.depthFunc(gl.EQUAL);
   gl.depthMask(false);
   gl.enable(gl.BLEND);
   gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
   gl.drawArrays(gl.TRIANGLES,side.start,side.count);
   gl.disable(gl.BLEND);
   gl.depthMask(true);
   gl.depthFunc(gl.LESS);
 }
 function adjustZoom(factor){
   zoom=Math.max(.6,Math.min(2.6,zoom*factor));
   draw();
 }
 function rotate(dx,dy){
   yaw=(yaw+dx)%(2*Math.PI);
   pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch+dy));
   draw();
 }
 document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>{
   selected=Number(button.dataset.variant);
   document.querySelectorAll('[data-variant]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
   document.querySelector('#finish').textContent=finishes[selected].note;
   draw();
 }));
 const views={front:[0,0],back:[Math.PI,0],side:[Math.PI/2,0],top:[0,Math.PI/2],reset:[-.14,.07]};
 document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{
   const name=button.dataset.view;
   if(name==='in'||name==='out'){adjustZoom(name==='in'?1.18:1/1.18);return;}
   [yaw,pitch]=views[name];
   if(name==='reset')zoom=1;
   draw();
 }));
 canvas.addEventListener('wheel',event=>{
   event.preventDefault();adjustZoom(Math.exp(-event.deltaY*.0015));
 },{passive:false});
 const pointers=new Map();
 const distance=()=>{const [a,b]=pointers.values();return Math.hypot(a.x-b.x,a.y-b.y);};
 canvas.addEventListener('pointerdown',event=>{
   if(event.pointerType==='mouse'&&event.button!==0)return;
   canvas.setPointerCapture(event.pointerId);
   pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
 });
 canvas.addEventListener('pointermove',event=>{
   const previous=pointers.get(event.pointerId);
   if(!previous)return;
   const before=pointers.size===2?distance():0;
   pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
   if(before>0)adjustZoom(distance()/before);
   else if(pointers.size===1)rotate((event.clientX-previous.x)*.009,(event.clientY-previous.y)*.009);
 });
 for(const name of ['pointerup','pointercancel','lostpointercapture']){
   canvas.addEventListener(name,event=>pointers.delete(event.pointerId));
 }
 canvas.addEventListener('keydown',event=>{
   const keys={ArrowLeft:[-.14,0],ArrowRight:[.14,0],ArrowUp:[0,-.14],ArrowDown:[0,.14]};
   if(keys[event.key]){event.preventDefault();rotate(...keys[event.key]);}
   else if(['+','=','-'].includes(event.key)){event.preventDefault();adjustZoom(event.key==='-'?1/1.12:1.12);}
 });
 new ResizeObserver(resize).observe(canvas);resize();
}
</script></html>
