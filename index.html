function init(){
 const vertex=`
 attribute vec3 position; attribute vec3 artwork; attribute vec3 normal;
 varying vec3 tex; varying vec3 n; varying vec3 p;
 uniform vec3 view; uniform vec2 resolution;
 vec3 rotate(vec3 q){
   float c=cos(view.x), s=sin(view.x), a=cos(view.y), b=sin(view.y);
   vec3 yaw=vec3(c*q.x+s*q.z,q.y,-s*q.x+c*q.z);
   return vec3(yaw.x,a*yaw.y-b*yaw.z,b*yaw.y+a*yaw.z);

   vec3 q=rotate(position); n=rotate(normal); p=position; tex=artwork;
   float w=1.0-q.z/8.0;

 const fragment=`
 precision mediump float;
 varying vec3 tex; varying vec3 n; varying vec3 p;
 uniform sampler2D photo; uniform vec3 lightTint, glassShoulder, glassBase; uniform int mode; uniform bool hasPrint;
 void main(){
   vec3 norm=normalize(n);
   float lighting=0.79+0.22*max(0.0,dot(norm,normalize(vec3(-0.45,0.7,1.0))));
   vec3 color;
   if(mode<=1){
     float depth=.51*min(1.0,.83+(p.y+1.71)*.13);
     float across=p.z/depth;
     float edge=abs(across);
     float curvature=clamp(1.0-abs(norm.z),0.0,1.0);
     float shoulder=smoothstep(.55,1.06,p.y);
     float heel=1.0-smoothstep(-1.64,-1.42,p.y);
     float sideHeight=smoothstep(-1.66,-1.46,p.y)*(1.0-smoothstep(.64,1.08,p.y));
     float yCurve=.04*cos((p.y+.25)*2.0);
     float roll=.07*norm.x;
     float key=exp(-pow((across-.68-roll-yCurve)/.085,2.0));
     float fill=exp(-pow((across+.79-roll+yCurve)/.070,2.0));
     float softbox=exp(-pow((across-.49-roll)/.235,2.0));
     float innerWall=exp(-pow((edge-.88)/.105,2.0))*sideHeight;
     float outerEdge=smoothstep(.91,1.0,edge);
     float liquidLine=exp(-pow((p.y+1.42+.05*across*across)/.045,2.0));
     float baseGlint=exp(-pow((p.y+1.60+.03*across*across)/.039,2.0));
     float shoulderGlint=exp(-pow((p.y-.91+.13*across*across)/.070,2.0));
     float gradient=smoothstep(-1.50,.83,p.y);
     vec3 glassColor=mix(glassBase,glassShoulder,gradient);
     glassColor=mix(glassColor,vec3(.97,.91,.88),heel*.86);
     glassColor*=1.0-innerWall*.36-outerEdge*.11-liquidLine*.24;
     float highlights=(key*.87+fill*.67+softbox*.22)*sideHeight
       +baseGlint*.86+shoulderGlint*.45+outerEdge*curvature*.23;
     glassColor=mix(glassColor,vec3(1.0,.98,.93),min(.94,highlights));
     float opacity=clamp(.76-gradient*.23+innerWall*.24+highlights*.31+shoulder*.14-heel*.12,.48,.97);
     if(mode==0 && hasPrint){
       vec4 ink=texture2D(photo,tex.xy);
       float coverage=ink.a*smoothstep(0.0,1.0,tex.z);
       glassColor=mix(glassColor,ink.rgb,coverage);
       opacity=mix(opacity,1.0,coverage);
     }
     gl_FragColor=vec4(glassColor,opacity);
     return;
   }else if(mode==2){
     color=lightTint*lighting+0.12*pow(max(0.0,dot(norm,normalize(vec3(-.32,.32,1.0)))),10.0);
   }else{
     color=vec3(.64,.37,.16)+vec3(.34,.43,.41)*pow(max(0.0,dot(norm,normalize(vec3(-.4,.2,1.0)))),6.0);
